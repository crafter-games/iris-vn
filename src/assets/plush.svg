<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd8cf"/>
      <stop offset="0.55" stop-color="#2fb3aa"/>
      <stop offset="1" stop-color="#1c8a84"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cc6bd"/>
      <stop offset="1" stop-color="#17736f"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff3ea"/>
      <stop offset="0.75" stop-color="#fbe0d0"/>
      <stop offset="1" stop-color="#eec5b1"/>
    </radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef0"/>
      <stop offset="1" stop-color="#b9c4c8"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#23272d"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#7ff0e6"/>
      <stop offset="0.5" stop-color="#2aa9a4"/>
      <stop offset="1" stop-color="#15515a"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- sombra en el suelo -->
  <ellipse cx="100" cy="212" rx="58" ry="7" fill="#000" opacity="0.35"/>

  <!-- coletas (detrás) -->
  <path d="M46 70 C18 92 12 140 22 186 C26 204 36 212 42 206 C36 184 40 150 52 118 C58 102 60 88 58 76 Z" fill="url(#tail)" stroke="#12605c" stroke-width="2"/>
  <path d="M154 70 C182 92 188 140 178 186 C174 204 164 212 158 206 C164 184 160 150 148 118 C142 102 140 88 142 76 Z" fill="url(#tail)" stroke="#12605c" stroke-width="2"/>
  <path d="M30 120 C28 150 30 176 38 198" fill="none" stroke="#7ce6de" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M170 120 C172 150 170 176 162 198" fill="none" stroke="#7ce6de" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>

  <!-- cuerpo -->
  <path d="M68 150 C64 176 62 196 70 204 L130 204 C138 196 136 176 132 150 Z" fill="url(#skirt)"/>
  <path d="M66 150 C66 136 80 130 100 130 C120 130 134 136 134 150 L136 176 C120 182 80 182 64 176 Z" fill="url(#shirt)" stroke="#8d9aa0" stroke-width="1.5"/>
  <path d="M94 134 L106 134 L103 170 L100 176 L97 170 Z" fill="#2fb3aa" stroke="#17736f" stroke-width="1.2"/>
  <ellipse cx="62" cy="168" rx="11" ry="14" fill="url(#skin)" stroke="#d9a992" stroke-width="1.2"/>
  <ellipse cx="138" cy="168" rx="11" ry="14" fill="url(#skin)" stroke="#d9a992" stroke-width="1.2"/>
  <ellipse cx="84" cy="206" rx="14" ry="8" fill="#23272d"/>
  <ellipse cx="116" cy="206" rx="14" ry="8" fill="#23272d"/>

  <!-- cabeza -->
  <path d="M100 18 C146 18 170 46 170 84 C170 120 142 140 100 140 C58 140 30 120 30 84 C30 46 54 18 100 18 Z" fill="url(#hair)" stroke="#12605c" stroke-width="2"/>
  <ellipse cx="100" cy="92" rx="58" ry="46" fill="url(#skin)"/>
  <ellipse cx="100" cy="92" rx="58" ry="46" fill="url(#shade)"/>
  <!-- flequillo -->
  <path d="M40 88 C38 50 62 28 100 28 C138 28 162 50 160 88 Q155 76 147 92 Q143 72 130 66 Q128 82 120 88 Q114 66 101 62 Q94 78 86 88 Q80 68 69 67 Q60 78 55 92 Q48 78 40 88 Z" fill="url(#hair)" stroke="#12605c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M40 86 C40 104 44 118 50 128 L56 96 Z" fill="url(#hair)" stroke="#12605c" stroke-width="1.5"/>
  <path d="M160 86 C160 104 156 118 150 128 L144 96 Z" fill="url(#hair)" stroke="#12605c" stroke-width="1.5"/>
  <path d="M70 40 C84 32 104 30 124 36" fill="none" stroke="#9ff3ec" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- ligas de las coletas -->
  <rect x="34" y="58" width="22" height="18" rx="4" fill="#2b2f36" stroke="#15181c" stroke-width="1.5" transform="rotate(-18 45 67)"/>
  <rect x="144" y="58" width="22" height="18" rx="4" fill="#2b2f36" stroke="#15181c" stroke-width="1.5" transform="rotate(18 155 67)"/>
  <rect x="39" y="63" width="12" height="4" rx="2" fill="#e8577a" transform="rotate(-18 45 67)"/>
  <rect x="149" y="63" width="12" height="4" rx="2" fill="#e8577a" transform="rotate(18 155 67)"/>

  <!-- ojos -->
  <g>
    <ellipse cx="78" cy="100" rx="11" ry="14" fill="#fff"/>
    <ellipse cx="78" cy="102" rx="9.5" ry="12" fill="url(#iris)"/>
    <ellipse cx="78" cy="104" rx="4.5" ry="6" fill="#0f3a40"/>
    <circle cx="74" cy="96" r="3.6" fill="#fff"/>
    <circle cx="82" cy="108" r="1.6" fill="#fff" opacity="0.8"/>
    <path d="M66 90 C72 85 84 85 90 90" fill="none" stroke="#1d2b30" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="122" cy="100" rx="11" ry="14" fill="#fff"/>
    <ellipse cx="122" cy="102" rx="9.5" ry="12" fill="url(#iris)"/>
    <ellipse cx="122" cy="104" rx="4.5" ry="6" fill="#0f3a40"/>
    <circle cx="118" cy="96" r="3.6" fill="#fff"/>
    <circle cx="126" cy="108" r="1.6" fill="#fff" opacity="0.8"/>
    <path d="M110 90 C116 85 128 85 134 90" fill="none" stroke="#1d2b30" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- rubor y boca -->
  <ellipse cx="64" cy="118" rx="9" ry="4.5" fill="#f59ab0" opacity="0.55"/>
  <ellipse cx="136" cy="118" rx="9" ry="4.5" fill="#f59ab0" opacity="0.55"/>
  <path d="M94 120 Q97 124 100 120 Q103 124 106 120" fill="none" stroke="#8a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
