<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1016" />
    <title>Iris.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="stage" aria-live="polite">
      <div id="scene" class="scene">
        <div class="bg">
          <div class="bg__layer"></div>
          <div class="bg__layer"></div>
        </div>
        <div class="grain" aria-hidden="true"></div>
        <img id="iris" class="char" alt="" draggable="false" />

        <section id="textbox" class="textbox" hidden>
          <div class="textbox__name"></div>
          <p class="textbox__body"></p>
          <span class="textbox__cursor" aria-hidden="true">▼</span>
        </section>

        <nav id="choices" class="choices" hidden></nav>

        <section id="phone" class="phone" hidden>
          <div class="phone__device">
            <header class="phone__header">
              <span class="phone__avatar">I</span>
              <span>
                <strong class="phone__contact">Iris</strong>
                <small class="phone__status">en línea</small>
              </span>
            </header>
            <div class="phone__log"></div>
            <form class="phone__form" hidden>
              <input class="phone__input" autocomplete="off" enterkeyhint="send" />
              <button class="phone__send" aria-label="Enviar">➤</button>
            </form>
          </div>
        </section>
      </div>

      <canvas id="fx-glass" class="fx-glass" aria-hidden="true"></canvas>
      <div id="flash" class="flash" aria-hidden="true"></div>

      <div id="titlecard" class="titlecard" hidden>
        <span class="titlecard__logo">Iris<span class="titlecard__ext">.exe</span></span>
      </div>

      <button id="start" class="start">
        <span class="start__play">▶ clic para empezar</span>
        <span class="start__hint">se recomienda jugar con audífonos</span>
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
