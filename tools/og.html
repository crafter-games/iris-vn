<!doctype html>
<!-- Composición de la imagen Open Graph (1200×630). La renderiza tools/og.mjs → public/og.jpg -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05060a;
        font-family: "Noto Serif", serif;
        color: #f4e9dc;
      }
      .bg {
        position: absolute;
        inset: -20px;
        background: url("../public/bg/bg_office_night.jpg") center / cover;
        filter: saturate(0.35) brightness(0.42) contrast(1.15) hue-rotate(-18deg);
      }
      .iris {
        position: absolute;
        right: 40px;
        bottom: -150px;
        height: 760px;
        filter: drop-shadow(0 0 40px rgb(0 0 0 / 0.6)) saturate(0.9);
      }
      .iris--creepy {
        clip-path: inset(0 0 0 50%);
        filter: saturate(0.55) contrast(1.3) brightness(0.85) drop-shadow(0 0 40px rgb(215 38 61 / 0.35));
        transform: translateX(5px);
      }
      .split {
        position: absolute;
        top: 0;
        bottom: 0;
        right: calc(40px + 313px);
        width: 2px;
        background: linear-gradient(transparent, #ff4d63 20%, #5ce1e6 60%, transparent);
        box-shadow: 0 0 12px #ff4d63;
        opacity: 0.8;
      }
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgb(5 6 10 / 0.97) 0%, rgb(5 6 10 / 0.85) 38%, rgb(5 6 10 / 0.1) 64%, rgb(5 6 10 / 0.3) 100%),
          linear-gradient(0deg, rgb(5 6 10 / 0.85) 0%, transparent 35%);
      }
      .scan {
        position: absolute;
        inset: 0;
        opacity: 0.25;
        background: repeating-linear-gradient(0deg, rgb(0 0 0 / 0.5) 0 1px, transparent 1px 3px);
      }
      .text {
        position: absolute;
        left: 80px;
        top: 150px;
      }
      h1 {
        margin: 0;
        font-size: 150px;
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.03em;
        text-shadow: 0 0 50px rgb(232 160 180 / 0.25);
      }
      h1 span {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.42em;
        font-weight: 400;
        letter-spacing: 0;
        color: #5ce1e6;
      }
      .tagline {
        margin: 18px 0 44px;
        font-size: 34px;
        font-style: italic;
        color: rgb(244 233 220 / 0.7);
      }
      .meta {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgb(244 233 220 / 0.55);
        line-height: 1.8;
      }
      .meta b {
        color: #e8a0b4;
        font-weight: 600;
      }
      .red {
        position: absolute;
        left: 80px;
        bottom: 48px;
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        letter-spacing: 0.1em;
        color: #ff4d63;
        text-shadow: 0 0 12px rgb(215 38 61 / 0.6);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <img class="iris" src="../public/chars/iris/iris_smile.png" alt="" />
    <img class="iris iris--creepy" src="../public/chars/iris/iris_creepy.png" alt="" />
    <div class="split"></div>
    <div class="shade"></div>
    <div class="scan"></div>
    <div class="text">
      <h1>Iris<span>.exe</span></h1>
      <p class="tagline">¿Confías en mí?</p>
      <p class="meta">Visual novel de citas y misterio<br />hecha por <b>Jibaru</b> · Crafter Station</p>
    </div>
    <p class="red">te estaré mirando.</p>
  </body>
</html>
